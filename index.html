<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

EZEE VISION ERP v4.0

</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<!-- Background -->

<div class="bg"></div>

<!-- Header -->

<!-- ===========================
     Premium Header
=========================== -->

<header class="header">

<div class="header-left">

<div class="logo">

🎓

</div>

<div>

<h1>EZEE VISION CHAMPUA</h1>

<p>Attendance Management System</p>

</div>

</div>

<div class="header-right">

<div class="admin-chip">

Made With ❤️ By Shahid Sir

</div>

</div>

</header>

<!-- Dashboard -->

<!-- ===========================
     Dashboard
=========================== -->

<section class="dashboard">

<div class="card students-card">

<div class="card-icon">
👨‍🎓
</div>

<div class="card-info">

<h2 id="totalStudents">0</h2>

<p>Total Students</p>

</div>

</div>

<div class="card present-card">

<div class="card-icon">
✅
</div>

<div class="card-info">

<h2 id="presentToday">0</h2>

<p>Present Today</p>

</div>

</div>

<div class="card absent-card">

<div class="card-icon">
❌
</div>

<div class="card-info">

<h2 id="absentToday">0</h2>

<p>Absent Today</p>

</div>

</div>

<div class="card attendance-card">

<div class="card-icon">
📊
</div>

<div class="card-info">

<h2 id="attendancePercent">0%</h2>

<p>Attendance</p>

</div>

</div>

</section>

<!-- ===========================
     Search + Quick Actions
=========================== -->

<section class="search-section">

<div class="search-box">

<span class="search-icon">🔍</span>

<input
type="text"
id="searchInput"
placeholder="Search by Name or Roll Number..."
>

</div>

<div class="quick-actions">

<button
id="addStudentBtn"
class="btn-primary">

<span>➕</span>

Add Student

</button>

<button
onclick="openAttendance()"
class="btn-secondary">

📅 Attendance

</button>

<button
onclick="openReport()"
class="btn-secondary">

📊 Reports

</button>

<button
onclick="openFees()"
class="btn-danger">

💰 Fees

</button>

</div>

</section>
<!-- Bottom Navigation -->

<nav class="bottom-nav">

<button onclick="location.href='index.html'">

🏠

<span>Home</span>

</button>

<button onclick="location.href='attendance.html'">

📅

<span>Attendance</span>

</button>

<button onclick="location.href='report.html'">

📊

<span>Report</span>

</button>

<button onclick="location.href='fees.html'">

💰

<span>Fees</span>

</button>

<button onclick="location.href='settings.html'">

⚙️

<span>Settings</span>

</button>

</nav>

<!-- Floating Button -->

<button

class="fab"

onclick="location.href='students.html'">

+

</button>

<!-- JavaScript -->

<script type="module" src="script.js"></script>

</body>

</html>
