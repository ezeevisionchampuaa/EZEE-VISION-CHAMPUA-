<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EZEE VISION Attendance</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<h1>EZEE VISION CHAMPUA</h1>
<p>Attendance Management System</p>

  <a href="attendance.html">

<button>

Daily Attendance

</button>

  </a>
  
</header>

  <div class="stats">

  <div class="card">
      <h2 id="totalStudents">0</h2>
      <p>Total Students</p>
  </div>

  <div class="card">
      <h2 id="presentToday">0</h2>
      <p>Present Today</p>
  </div>

  <div class="card">
      <h2 id="absentToday">0</h2>
      <p>Absent Today</p>
  </div>

</div>

<input
type="text"
id="searchBox"
placeholder="Search Student..."
onkeyup="render()">
  <a href="report.html">
<button>Monthly Report</button>
  </a>
<div class="container">

<div class="card">
<h2 id="students">0</h2>
<p>Total Students</p>
</div>

<div class="card">
<h2 id="present">0</h2>
<p>Present Today</p>
</div>

<div class="card">
<h2 id="percentage">0%</h2>
<p>Attendance</p>
</div>

<button onclick="addStudent()">
+ Add Student
</button>

<div id="studentList"></div>

</div>
