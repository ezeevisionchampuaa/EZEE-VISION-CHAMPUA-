<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#07111F"
    >

    <title>
        Attendance • EZEE VISION CHAMPUA
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/attendance.css"
    >

</head>

<body>

<div class="app">

    <!-- ==========================
         HEADER
    ========================== -->

    <header class="topbar">

        <div class="brand">

            <div class="brand-logo">

                <i class="fa-solid fa-calendar-check"></i>

            </div>

            <div>

                <h1>Attendance</h1>

                <p>EZEE VISION CHAMPUA</p>

            </div>

        </div>

        <div class="top-actions">

            <button
                class="icon-btn"
                id="themeBtn"
                type="button"
            >

                <i class="fa-solid fa-moon"></i>

            </button>

        </div>

    </header>


    <!-- ==========================
         MAIN
    ========================== -->

    <main class="main-content">

        <!-- ==========================
             ATTENDANCE HEADER
        ========================== -->

        <section class="attendance-header">

            <div>

                <span class="hero-badge">

                    <i class="fa-solid fa-calendar-day"></i>

                    Daily Attendance

                </span>

                <h2>
                    Mark Attendance
                </h2>

                <p>
                    Select the class and mark today's
                    student attendance.
                </p>

            </div>

        </section>


        <!-- ==========================
             DATE & CLASS
        ========================== -->

        <section class="glass attendance-controls">

            <div class="control-group">

                <label for="attendanceDate">
                    Date
                </label>

                <input
                    type="date"
                    id="attendanceDate"
                >

            </div>

            <div class="control-group">

                <label for="attendanceClass">
                    Class
                </label>

                <select id="attendanceClass">

                    <option value="">
                        All Classes
                    </option>

                    <option value="Class 6">
                        Class 6
                    </option>

                    <option value="Class 7">
                        Class 7
                    </option>

                    <option value="Class 8">
                        Class 8
                    </option>

                    <option value="Class 9">
                        Class 9
                    </option>

                    <option value="Class 10">
                        Class 10
                    </option>

                </select>

            </div>

        </section>


        <!-- ==========================
             ATTENDANCE SUMMARY
        ========================== -->

        <section class="attendance-summary">

            <div class="glass attendance-stat">

                <span>
                    Total
                </span>

                <strong id="attendanceTotal">
                    0
                </strong>

            </div>

            <div class="glass attendance-stat">

                <span>
                    Present
                </span>

                <strong id="attendancePresent">
                    0
                </strong>

            </div>

            <div class="glass attendance-stat">

                <span>
                    Absent
                </span>

                <strong id="attendanceAbsent">
                    0
                </strong>

            </div>

        </section>


        <!-- ==========================
             STUDENT ATTENDANCE LIST
        ========================== -->

        <section>

            <div class="section-title">

                <div>

                    <h2>
                        Students
                    </h2>

                    <p>
                        Mark present or absent
                    </p>

                </div>

            </div>

            <div
                id="attendanceList"
                class="attendance-list"
            >

                <div class="glass attendance-empty">

                    <i class="fa-solid fa-users"></i>

                    <h3>
                        No Students Found
                    </h3>

                    <p>
                        Add students first from the
                        Students module.
                    </p>

                </div>

            </div>

        </section>


        <!-- ==========================
             SAVE BUTTON
        ========================== -->

        <button
            class="primary-btn attendance-save"
            id="saveAttendance"
            type="button"
        >

            <i class="fa-solid fa-floppy-disk"></i>

            Save Attendance

        </button>

    </main>


    <!-- ==========================
         BOTTOM NAVIGATION
    ========================== -->

    <nav class="bottom-nav">

        <a
            href="index.html"
            class="nav-item"
        >

            <i class="fa-solid fa-house"></i>

            <span>
                Home
            </span>

        </a>

        <a
            href="students.html"
            class="nav-item"
        >

            <i class="fa-solid fa-user-graduate"></i>

            <span>
                Students
            </span>

        </a>

        <a
            href="attendance.html"
            class="nav-item active"
        >

            <i class="fa-solid fa-calendar-check"></i>

            <span>
                Attendance
            </span>

        </a>

        <a
            href="fees.html"
            class="nav-item"
        >

            <i class="fa-solid fa-wallet"></i>

            <span>
                Fees
            </span>

        </a>

        <a
            href="reports.html"
            class="nav-item"
        >

            <i class="fa-solid fa-chart-column"></i>

            <span>
                Reports
            </span>

        </a>

    </nav>

</div>


<!-- ==========================
     JAVASCRIPT
========================== -->

<script src="assets/js/app.js"></script>

<script src="assets/js/ui.js"></script>

<script src="assets/js/attendance.js"></script>

</body>

</html>
