<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

EZEE VISION ERP | Admin Login

</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link
rel="stylesheet"
href="login.css">

</head>

<body>

<div class="background"></div>

<div class="login-wrapper">

<div class="login-card">

<div class="logo">

<div class="logo-circle">

<i class="fas fa-user-shield"></i>

</div>

<h1>

EZEE VISION ERP

</h1>

<p>

Admin Login Portal

</p>

</div>

<div class="login-content">

<form id="loginForm" autocomplete="off">

<div class="input-group">

<label for="email">

Email Address

</label>

<div class="input-box">

<i class="fas fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Enter your email"
required>

</div>

</div>

<div class="input-group">

<label for="password">

Password

</label>

<div class="input-box">

<i class="fas fa-lock"></i>

<input
type="password"
id="password"
placeholder="Enter your password"
required>

<button
type="button"
id="togglePassword"
class="toggle-password">

<i class="fas fa-eye"></i>

</button>

</div>

</div>

<div
id="errorMessage"
class="error-message">

</div>
  <div class="login-options">

<label class="remember-me">

<input
type="checkbox"
id="rememberMe">

<span>

Remember Me

</span>

</label>

<a
href="#"
id="forgotPassword">

Forgot Password?

</a>

</div>

<button
type="submit"
id="loginBtn"
class="login-btn">

<i class="fas fa-right-to-bracket"></i>

<span>

Login

</span>

</button>

</form>
</div>

<div class="login-footer">

<p>

© 2026 EZEE VISION CHAMPUA

</p>

<p>

ERP Version 6.0

</p>

</div>

</div>

</div>

<script type="module" src="login.js"></script>

</body>

</html>
