<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

Students • EZEE VISION CHAMPUA

</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link
rel="stylesheet"
href="assets/css/style.css">

<link
rel="stylesheet"
href="assets/css/students.css">

</head>

<body>

<div class="app">

<header class="topbar">

<div class="brand">

<div class="brand-logo">

<i class="fa-solid fa-user-graduate"></i>

</div>

<div>

<h1>Students</h1>

<p>EZEE VISION CHAMPUA</p>

</div>

</div>

<div class="top-actions">

<button
class="icon-btn"
id="themeBtn">

<i class="fa-solid fa-moon"></i>

</button>

</div>

</header>

<main class="main-content">
  <section class="search-section">

<div class="glass search-box">

<i class="fa-solid fa-magnifying-glass"></i>

<input
type="search"
id="studentSearch"
placeholder="Search student...">

</div>

<div class="filter-row">

<select id="classFilter">

<option value="">

All Classes

</option>

<option>Class 6</option>
<option>Class 7</option>
<option>Class 8</option>
<option>Class 9</option>
<option>Class 10</option>

</select>

<select id="statusFilter">

<option value="">

All Status

</option>

<option>Active</option>

<option>Inactive</option>

</select>

</div>

  </section>
  <section>

<div
id="studentCards"
class="students-grid">

</div>

</section>

<button
class="fab"
id="addStudentBtn">

<i class="fa-solid fa-plus"></i>

</button>
<!-- Student Modal -->

<div class="modal" id="studentModal">

    <div class="modal-box glass">

        <div class="modal-header">

            <h2 id="modalTitle">
                Add Student
            </h2>

            <button id="closeModal" class="icon-btn">
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>

        <form id="studentForm">

            <input
                type="hidden"
                id="studentId">

            <input
                type="text"
                id="studentName"
                placeholder="Student Name"
                required>

            <select id="studentClass" required>
                <option value="">Select Class</option>
                <option>Class 6</option>
                <option>Class 7</option>
                <option>Class 8</option>
                <option>Class 9</option>
                <option>Class 10</option>
            </select>

            <select id="studentStatus">
                <option>Active</option>
                <option>Inactive</option>
            </select>

            <button
                type="submit"
                class="primary-btn">
                Save Student
            </button>

        </form>

    </div>

</div>
</main>

<nav class="bottom-nav">

    <a href="index.html" class="nav-item">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
    </a>

    <a href="students.html" class="nav-item active">
        <i class="fa-solid fa-user-graduate"></i>
        <span>Students</span>
    </a>

    <a href="attendance.html" class="nav-item">
        <i class="fa-solid fa-calendar-check"></i>
        <span>Attendance</span>
    </a>

    <a href="fees.html" class="nav-item">
        <i class="fa-solid fa-wallet"></i>
        <span>Fees</span>
    </a>

    <a href="reports.html" class="nav-item">
        <i class="fa-solid fa-chart-column"></i>
        <span>Reports</span>
    </a>

</nav>

<script src="assets/js/app.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/students.js"></script>

</body>
</html>
