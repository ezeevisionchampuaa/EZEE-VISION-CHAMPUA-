<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<meta
name="theme-color"
content="#07111F">

<meta
name="description"
content="EZEE VISION CHAMPUA - Students Management">

<meta
name="author"
content="Shahid Sir">

<title>

Students • EZEE VISION CHAMPUA

</title>

<!-- Google Fonts -->

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<!-- Font Awesome -->

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<!-- CSS -->

<link
rel="stylesheet"
href="assets/css/style.css">

<link
rel="stylesheet"
href="assets/css/students.css">

</head>

<body>

<div class="app">

<!-- ===========================
     HEADER
=========================== -->

<header class="topbar">

<div class="brand">

<div class="brand-logo">

<i class="fa-solid fa-user-graduate"></i>

</div>

<div>

<h1>

Students

</h1>

<p>

EZEE VISION CHAMPUA

</p>

</div>

</div>

<div class="top-actions">

<button
class="icon-btn"
id="themeBtn"
aria-label="Toggle Theme">

<i class="fa-solid fa-moon"></i>

</button>

</div>

</header>

<!-- ===========================
     MAIN
=========================== -->

<main class="main-content">

<!-- ===========================
     SEARCH & FILTER
=========================== -->

<section class="search-section">

<div class="glass search-box">

<i class="fa-solid fa-magnifying-glass"></i>

<input
type="search"
id="studentSearch"
placeholder="Search student..."
autocomplete="off">

</div>

<div class="filter-row">

<select id="classFilter">

<option value="">

All Classes

</option>

<option>Class 6</option>

<option>Class 7</option>

<option>Class 8</option>

<option>Class 9</option>

<option>Class 10</option>

</select>

<select id="statusFilter">

<option value="">

All Status

</option>

<option>

Active

</option>

<option>

Inactive

</option>

</select>

</div>

</section>
<!-- ===========================
     STUDENTS LIST
=========================== -->

<section class="students-section">

<div
id="studentCards"
class="students-grid">

    <!-- Students will be rendered here -->

</div>

</section>

<!-- ===========================
     FLOATING ACTION BUTTON
=========================== -->

<button
class="fab"
id="addStudentBtn"
aria-label="Add Student">

<i class="fa-solid fa-plus"></i>

</button>

  <!-- ===========================
     STUDENT MODAL
=========================== -->

<div
class="modal"
id="studentModal">

    <div class="modal-box glass">

        <div class="modal-header">

            <h2 id="modalTitle">

                Add Student

            </h2>

            <button
            id="closeModal"
            class="icon-btn"
            aria-label="Close">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <form id="studentForm">

            <input
            type="hidden"
            id="studentId">

            <div class="form-group">

                <label for="studentName">

                    Student Name

                </label>

                <input
                type="text"
                id="studentName"
                placeholder="Enter student name"
                required>

            </div>

            <div class="form-group">

                <label for="studentClass">

                    Class

                </label>

                <select
                id="studentClass"
                required>

                    <option value="">

                        Select Class

                    </option>

                    <option>Class 6</option>
                    <option>Class 7</option>
                    <option>Class 8</option>
                    <option>Class 9</option>
                    <option>Class 10</option>

                </select>

            </div>

            <div class="form-group">

                <label for="studentStatus">

                    Status

                </label>

                <select
                id="studentStatus">

                    <option>

                        Active

                    </option>

                    <option>

                        Inactive

                    </option>

                </select>

            </div>

            <div class="modal-actions">

                <button
                type="button"
                id="cancelStudent"
                class="secondary-btn">

                    Cancel

                </button>

                <button
                type="submit"
                class="primary-btn">

                    Save Student

                </button>

            </div>

        </form>

    </div>

</div>
<!-- ===========================
     END MAIN
=========================== -->

</main>

</div>

<!-- ===========================
     BOTTOM NAVIGATION
=========================== -->

<nav class="bottom-nav">

    <a
    href="index.html"
    class="nav-item">

        <i class="fa-solid fa-house"></i>

        <span>

            Home

        </span>

    </a>

    <a
    href="students.html"
    class="nav-item active">

        <i class="fa-solid fa-user-graduate"></i>

        <span>

            Students

        </span>

    </a>

    <a
    href="attendance.html"
    class="nav-item">

        <i class="fa-solid fa-calendar-check"></i>

        <span>

            Attendance

        </span>

    </a>

    <a
    href="fees.html"
    class="nav-item">

        <i class="fa-solid fa-wallet"></i>

        <span>

            Fees

        </span>

    </a>

    <a
    href="reports.html"
    class="nav-item">

        <i class="fa-solid fa-chart-column"></i>

        <span>

            Reports

        </span>

    </a>

</nav>

<!-- ===========================
     JAVASCRIPT
=========================== -->

<script src="assets/js/app.js"></script>

<script src="assets/js/ui.js"></script>

<script src="assets/js/students.js"></script>

</body>

</html>
