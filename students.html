<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#0F172A">

    <meta name="description"
          content="Student Management - EZEE VISION CHAMPUA">

    <title>

        Students • EZEE VISION CHAMPUA

    </title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="assets/css/style.css">

    <link rel="stylesheet"
          href="assets/css/students.css">

</head>

<body>

<!-- Background -->

<div class="bg-gradient"></div>

<div class="bg-circle circle-1"></div>

<div class="bg-circle circle-2"></div>

<div class="bg-circle circle-3"></div>

<div class="app">

<!-- ===========================
     HEADER
============================ -->

<header class="header">

<div class="brand">

<div class="brand-logo">

<i class="fa-solid fa-graduation-cap"></i>

</div>

<div>

<h1>

EZEE VISION

<span>

CHAMPUA

</span>

</h1>

<p>

Student Management

</p>

</div>

</div>

<div class="header-actions">

<button
class="icon-btn"
onclick="location.href='index.html'">

<i class="fa-solid fa-house"></i>

</button>

</div>

</header>

<!-- ===========================
     PAGE TITLE
============================ -->

<section class="page-title">

<h2>

Students

</h2>

<p>

Manage admissions, records and student details

</p>

</section>

<!-- ===========================
     SEARCH
============================ -->

<section class="glass search-box">

<div class="search-input">

<i class="fa-solid fa-magnifying-glass"></i>

<input
type="search"
id="searchStudent"
placeholder="Search student by name, roll or admission no...">

</div>

</section>

<!-- ===========================
     FILTERS
============================ -->

<section class="filter-grid">

<select
id="classFilter"
class="glass">

<option value="">

All Classes

</option>

<option>

Class 6

</option>

<option>

Class 7

</option>

<option>

Class 8

</option>

<option>

Class 9

</option>

<option>

Class 10

</option>

</select>

<select
id="statusFilter"
class="glass">

<option value="">

All Status

</option>

<option>

Active

</option>

<option>

Inactive

</option>

</select>

</section>

<!-- ===========================
     SUMMARY
============================ -->

<section class="students-summary">

<div class="glass summary-item">

<h3 id="totalStudents">

0

</h3>

<p>

Total Students

</p>

</div>

<div class="glass summary-item">

<h3 id="activeStudents">

0

</h3>

<p>

Active

</p>

</div>

<div class="glass summary-item">

<h3 id="inactiveStudents">

0

</h3>

<p>

Inactive

</p>

</div>

</section>

<!-- ===========================
     STUDENT LIST START
============================ -->

<section
id="studentList"
class="student-list">

<!-- ==========================================
     EMPTY STATE
========================================== -->

<div id="emptyState" class="glass empty-state">

    <i class="fa-solid fa-user-graduate"></i>

    <h3>

        No Students Found

    </h3>

    <p>

        Start by adding your first student.

    </p>

    <button
        id="firstStudentBtn"
        class="primary-btn">

        <i class="fa-solid fa-user-plus"></i>

        Add Student

    </button>

</div>

<!-- ==========================================
     STUDENT CARD CONTAINER
========================================== -->

<div
    id="studentCards"
    class="student-cards">

    <!-- Students will be loaded dynamically -->

</div>

</section>

<!-- ==========================================
     FLOATING ADD BUTTON
========================================== -->

<button
    id="addStudentFab"
    class="fab"
    aria-label="Add Student">

    <i class="fa-solid fa-plus"></i>

</button>

<!-- ==========================================
     ADD / EDIT STUDENT MODAL
========================================== -->

<div
    id="studentModal"
    class="modal"
    hidden>

    <div class="modal-content glass">

        <div class="modal-header">

            <h2 id="modalTitle">

                New Admission

            </h2>

            <button
                id="closeModal"
                class="icon-btn">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <form
            id="studentForm"
            autocomplete="off">

            <div class="form-grid">

<!-- Student ID -->
<div class="form-group">
    <label>Student ID</label>
    <input type="text" id="studentId" readonly>
</div>

<!-- Admission No -->
<div class="form-group">
    <label>Admission No.</label>
    <input type="text" id="admissionNo" readonly>
</div>

<!-- Roll No -->
<div class="form-group">
    <label>Roll Number</label>
    <input type="text" id="rollNo" required>
</div>

<!-- Student Name -->
<div class="form-group">
    <label>Student Name</label>
    <input type="text" id="studentName" required>
</div>

<!-- Father Name -->
<div class="form-group">
    <label>Father's Name</label>
    <input type="text" id="fatherName" required>
</div>

<!-- Mother Name -->
<div class="form-group">
    <label>Mother's Name</label>
    <input type="text" id="motherName">
</div>

<!-- Mobile -->
<div class="form-group">
    <label>Mobile Number</label>
    <input type="tel" id="mobile" required>
</div>

<!-- Alternate Mobile -->
<div class="form-group">
    <label>Alternate Mobile</label>
    <input type="tel" id="alternateMobile">
</div>

<!-- Date of Birth -->
<div class="form-group">
    <label>Date of Birth</label>
    <input type="date" id="dob">
</div>

<!-- Address -->
<div class="form-group">
    <label>Address</label>
    <textarea id="address" rows="3"></textarea>
</div>

<!-- Class -->
<div class="form-group">
    <label>Class</label>
    <select id="studentClass" required>
        <option value="">Select Class</option>
        <option>Class 6</option>
        <option>Class 7</option>
        <option>Class 8</option>
        <option>Class 9</option>
        <option>Class 10</option>
    </select>
</div>

<!-- Monthly Fees -->
<div class="form-group">
    <label>Monthly Fees (₹)</label>
    <input type="number" id="monthlyFees" required>
</div>

<!-- Admission Date -->
<div class="form-group">
    <label>Admission Date</label>
    <input type="date" id="admissionDate">
</div>

<!-- Status -->
<div class="form-group">
    <label>Status</label>
    <select id="studentStatus">
        <option>Active</option>
        <option>Inactive</option>
    </select>
</div>

<!-- Student Photo -->
<div class="form-group">
    <label>Student Photo</label>
    <input type="file" id="studentPhoto" accept="image/*">
</div>
                
            <div class="modal-actions">

                <button
                    type="button"
                    id="cancelStudent"
                    class="secondary-btn">

                    Cancel

                </button>

                <button
                    type="submit"
                    id="saveStudent"
                    class="primary-btn">

                    Save Student

                </button>

            </div>

        </form>

    </div>

</div>

  <!-- ==========================================
     BOTTOM NAVIGATION
========================================== -->

<nav class="bottom-nav">

    <button
        class="nav-item"
        data-page="dashboard">

        <i class="fa-solid fa-house"></i>

        <span>Home</span>

    </button>

    <button
        class="nav-item active"
        data-page="students">

        <i class="fa-solid fa-user-graduate"></i>

        <span>Students</span>

    </button>

    <button
        class="nav-item"
        data-page="attendance">

        <i class="fa-solid fa-calendar-check"></i>

        <span>Attendance</span>

    </button>

    <button
        class="nav-item"
        data-page="fees">

        <i class="fa-solid fa-wallet"></i>

        <span>Fees</span>

    </button>

    <button
        class="nav-item"
        data-page="reports">

        <i class="fa-solid fa-chart-column"></i>

        <span>Reports</span>

    </button>

</nav>

<!-- ==========================================
     FOOTER
========================================== -->

<footer class="footer">

    <p>

        © <span id="currentYear"></span>

        EZEE VISION CHAMPUA

    </p>

    <p>

        Made With ❤️ By <strong>Shahid Sir</strong>

    </p>

</footer>

</div>

<!-- ==========================================
     JAVASCRIPT
========================================== -->

<script src="assets/js/app.js"></script>

<script src="assets/js/ui.js"></script>

<script src="assets/js/students.js"></script>

</body>

</html>
